<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瓦片源测试 — 国内可用国际瓦片</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin:0; font-family:system-ui; }
  h2 { padding:10px 14px 0; margin:0; font-size:15px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; height:calc(100vh - 40px); }
  .cell { display:flex; flex-direction:column; }
  .cell .label { font-size:12px; padding:3px 6px; background:#eee; border-radius:4px 4px 0 0; display:flex; justify-content:space-between; }
  .cell .label .status { color:#666; font-size:11px; }
  .map { flex:1; border-radius:0 0 4px 4px; border:1px solid #ddd; min-height:0; }
</style>
</head>
<body>
<h2>瓦片源测试 — 新加坡 z=16</h2>
<div class="grid" id="grid"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const C = [1.3075, 103.791], Z = 16
const tests = [
  { n:'OSM', u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', z:19 },
  { n:'OSM (a)', u:'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png', z:19 },
  { n:'OSM (b)', u:'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png', z:19 },
  { n:'CartoDB Lite', u:'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', z:19 },
  { n:'CartoDB Dark', u:'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', z:19 },
  { n:'CyclOSM', u:'https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', z:20 },
  { n:'Stadia Water', u:'https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg', z:18 },
  { n:'Stadia Toner', u:'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}.png', z:18 },
  { n:'Esri Street', u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', z:19 },
  { n:'Esri Topo', u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', z:19 },
  { n:'Esri Imagery', u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', z:19 },
  { n:'Bing', u:'https://t{s}.tiles.virtualearth.net/tiles/r{quad}?g=1', z:19 },
]
const grid = document.getElementById('grid')
tests.forEach((t,i)=>{
  const d=document.createElement('div');d.className='cell'
  d.innerHTML=`<div class="label">${i+1} ${t.n}<span class="status" id="s${i}">⏳</span></div><div class="map" id="m${i}"></div>`
  grid.appendChild(d)
})
setTimeout(()=>{
  tests.forEach((t,i)=>{
    const m=L.map('m'+i,{zoomControl:false,attributionControl:false}).setView(C,Z)
    let lc=0,fc=0
    const l=L.tileLayer(t.u,{maxZoom:t.z,subdomains:t.u.includes('{s}')?['0','1','2','3']:[]})
    l.on('tileload',()=>{lc++;document.getElementById('s'+i).textContent=`✅${lc}`})
    l.on('tileerror',()=>{fc++;document.getElementById('s'+i).textContent=`❌${fc}`})
    l.addTo(m)
  })
},200)
</script>
</body>
</html>
