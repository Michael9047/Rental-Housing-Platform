<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高德瓦片源测试 v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin:0; font-family: system-ui; }
  h2 { padding:12px 16px 0; margin:0; font-size:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; height:calc(100vh - 50px); }
  .cell { display:flex; flex-direction:column; }
  .cell .label { font-size:13px; padding:4px 8px; background:#eee; border-radius:4px 4px 0 0; }
  .cell .label .status { color:#888; font-size:11px; }
  .map { flex:1; border-radius:0 0 4px 4px; border:1px solid #ddd; }
</style>
</head>
<body>
<h2>高德瓦片测试 — 新加坡 (1.3075, 103.791) z=17 / z=18</h2>
<div class="grid">
  <div class="cell">
    <div class="label">① OSM 对照 <span class="status" id="s0"></span></div>
    <div class="map" id="m0"></div>
  </div>
  <div class="cell">
    <div class="label">② Amap HTTP size=2 scale=2 (高清) <span class="status" id="s1"></span></div>
    <div class="map" id="m1"></div>
  </div>
  <div class="cell">
    <div class="label">③ Amap HTTPS style=8 size=2 scale=2 <span class="status" id="s2"></span></div>
    <div class="map" id="m2"></div>
  </div>
  <div class="cell">
    <div class="label">④ Amap HTTPS style=7 size=2 scale=2 +key <span class="status" id="s3"></span></div>
    <div class="map" id="m3"></div>
  </div>
</div>
<p style="padding:0 16px;color:#888;font-size:13px">scale=2 → 高清 Retina | style=8 → 可能需要付费授权 | 海外覆盖取决于高德数据授权</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY = 'd236c5d4b0bb068d9da00e0066a8f85c'
const CENTER = [1.3075, 103.791]
const ZOOM = 17

const tests = [
  { id:'m0', sid:'s0', url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts:{maxZoom:19,subdomains:[]} },
  { id:'m1', sid:'s1', url:`http://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=2&scale=2&style=7&x={x}&y={y}&z={z}`, opts:{maxZoom:18,subdomains:[]} },
  { id:'m2', sid:'s2', url:`https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=2&scale=2&style=8&x={x}&y={y}&z={z}&key=${KEY}`, opts:{maxZoom:18,subdomains:[]} },
  { id:'m3', sid:'s3', url:`https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=2&scale=2&style=7&x={x}&y={y}&z={z}&key=${KEY}`, opts:{maxZoom:18,subdomains:[]} },
]

for (const t of tests) {
  const map = L.map(t.id, { zoomControl:true, attributionControl:false })
    .setView(CENTER, ZOOM)
  const layer = L.tileLayer(t.url, t.opts)
  let loaded = 0, failed = 0
  layer.on('tileload', () => { loaded++; document.getElementById(t.sid).textContent = `✅ ${loaded} loaded` })
  layer.on('tileerror', () => { failed++; document.getElementById(t.sid).textContent = `❌ ${failed} failed` })
  layer.addTo(map)
}
</script>
</body>
</html>
