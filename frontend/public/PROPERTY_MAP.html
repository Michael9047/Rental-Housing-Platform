<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房源地图可视化 — Property Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --bg: #0f1117; --card: #161822; --border: #252836;
  --text: #cdd6f4; --muted: #6c7086; --accent: #89b4fa;
  --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 380px; min-width: 380px; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg); }
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 18px; font-weight: 700; }
.sidebar-header h1 span { color: var(--accent); }
.sidebar-header .subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
.config-row { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); align-items: center; }
.config-row input { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: 12px system-ui; outline: none; flex: 1; }
.config-row input:focus { border-color: var(--accent); }
.config-row button { background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 6px 14px; font: 12px system-ui; font-weight: 600; cursor: pointer; white-space: nowrap; }
.config-row button:disabled { opacity: .4; cursor: default; }
.stats-bar { display: flex; gap: 0; padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 11px; }
.stat-item { flex: 1; text-align: center; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }
.stat-item .num { font-size: 20px; font-weight: 700; color: var(--accent); }
.stat-item .label { color: var(--muted); margin-top: 2px; }
.filter-row { display: flex; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.filter-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--muted); transition: all .15s; }
.filter-chip:hover { border-color: var(--accent); color: var(--text); }
.filter-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.property-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.property-item { padding: 10px 20px; cursor: pointer; border-bottom: 1px solid rgba(37,38,46,.5); transition: background .15s; }
.property-item:hover { background: var(--card); }
.property-item.active { background: #1a2a38; border-left: 3px solid var(--accent); padding-left: 17px; }
.property-item .p-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.property-item .p-info { font-size: 11px; color: var(--muted); }
.property-item .p-price { color: var(--accent); font-weight: 700; font-size: 13px; }
.property-item .p-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.property-item .p-city { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.map-container { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }
.legend { position: absolute; bottom: 30px; right: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 11px; z-index: 1000; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
#loader { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 30px; text-align: center; z-index: 1001; }
#loader .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loader .msg { font-size: 13px; color: var(--muted); }
.debug-panel { border-top: 1px solid var(--border); padding: 10px 16px; font-size: 11px; font-family: 'JetBrains Mono', monospace; max-height: 180px; overflow-y: auto; background: #0a0b10; }
.debug-line { padding: 2px 0; border-bottom: 1px solid rgba(37,38,46,.3); word-break: break-all; }
.debug-ok   { color: var(--green); }
.debug-info { color: var(--accent); }
.debug-warn { color: var(--yellow); }
.debug-err  { color: var(--red); }
.debug-time { color: var(--muted); font-size: 10px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.leaflet-popup-content-wrapper { background: var(--card) !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; font: 13px system-ui, sans-serif !important; }
.leaflet-popup-tip { background: var(--card) !important; }
.leaflet-popup-content { margin: 10px 14px !important; }
.popup-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.popup-row { font-size: 12px; color: var(--muted); margin: 2px 0; }
.popup-price { font-size: 16px; font-weight: 700; color: var(--accent); margin: 6px 0; }
.popup-badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.popup-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #1a2a38; color: var(--accent); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>🏠 房源地图 <span>可视化</span></h1>
    <div class="subtitle">32栋（新加坡12 + 伦敦20），UCL/Imperial/LSE/KCL/UAL 五校</div>
  </div>

  <div class="config-row">
    <input id="baseUrl" value="http://localhost:8000/api/v1" placeholder="API Base URL">
    <button id="btnLoad" onclick="loadProperties()">🔍 加载房源</button>
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap">
      <input type="checkbox" id="chkUni" checked onchange="toggleUniversities()"> 🎓 大学
    </label>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-item"><div class="num" id="statTotal">0</div><div class="label">公寓楼</div></div>
    <div class="stat-item"><div class="num" id="statCities">0</div><div class="label">城市</div></div>
    <div class="stat-item"><div class="num" id="statUT">0</div><div class="label">总户型</div></div>
  </div>

  <div class="filter-row" id="filterRow" style="display:none"></div>

  <div class="property-list" id="propertyList">
    <div class="empty-state">
      <div style="font-size:48px;margin-bottom:12px">🗺️</div>
      <div>点击「加载房源」从后端获取数据</div>
      <div style="font-size:11px;margin-top:4px">API: GET /api/v1/buildings/public/search</div>
    </div>
  </div>

  <div class="debug-panel" id="debugPanel"></div>
</div>

<div class="map-container">
  <div id="map"></div>
  <div id="loader"><div class="spinner"></div><div class="msg">加载中...</div></div>
  <div class="legend" id="legendBox">
    <div style="font-weight:600;margin-bottom:6px">🏠 公寓分布 (32栋)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a6e3a1"></div> 新加坡 12栋 (S$/月)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f38ba8"></div> 伦敦 20栋 (£/周)</div>
    <div style="font-weight:600;margin:8px 0 4px;border-top:1px solid var(--border);padding-top:8px">🎓 大学</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f38ba8;border:2px solid #fff;width:8px;height:8px"></div> 伦敦 9所</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a6e3a1;border:2px solid #fff;width:8px;height:8px"></div> 新加坡 3所</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══ 调试日志 ═══
function debug(msg, cls) { cls = cls || 'info'; const panel = document.getElementById('debugPanel'); if (!panel) return; const now = new Date().toLocaleTimeString(); const line = document.createElement('div'); line.className = 'debug-line debug-' + cls; line.innerHTML = '<span class="debug-time">' + now + '</span> ' + msg; panel.prepend(line); while (panel.children.length > 50) panel.lastChild.remove(); }

// ═══ 大学 ═══
const UNIVERSITIES = [
  { name: 'UCL', abbr:'UCL', lat:51.5246, lng:-0.1337, city:'伦敦' },
  { name: 'Imperial', abbr:'Imperial', lat:51.4988, lng:-0.1749, city:'伦敦' },
  { name: 'LSE', abbr:'LSE', lat:51.5141, lng:-0.1165, city:'伦敦' },
  { name: "King's", abbr:'KCL', lat:51.5115, lng:-0.1160, city:'伦敦' },
  { name: 'Queen Mary', abbr:'QMUL', lat:51.5236, lng:-0.0419, city:'伦敦' },
  { name: 'UAL', abbr:'UAL', lat:51.5145, lng:-0.1384, city:'伦敦' },
  { name: 'Goldsmiths', abbr:'Goldsmiths', lat:51.4742, lng:-0.0359, city:'伦敦' },
  { name: 'Greenwich', abbr:'Greenwich', lat:51.4826, lng:-0.0077, city:'伦敦' },
  { name: 'LSBU', abbr:'LSBU', lat:51.4988, lng:-0.1026, city:'伦敦' },
  { name: 'NUS', abbr:'NUS', lat:1.2966, lng:103.7764, city:'新加坡' },
  { name: 'NTU', abbr:'NTU', lat:1.3483, lng:103.6831, city:'新加坡' },
  { name: 'SMU', abbr:'SMU', lat:1.2963, lng:103.8502, city:'新加坡' },
];
const UNI_COLORS = { '伦敦':'#f38ba8', '新加坡':'#a6e3a1' };

// ═══ 全局状态 ═══
let allProperties = [], markers = [], uniMarkers = [], showUniversities = true, activeFilter = 'all', map;

// ═══ 货币 ═══
const CURRENCY = { SG:{sym:'S$',label:'/月'}, GB:{sym:'£',label:'/周'} };
function fmtPrice(p) {
  const c = CURRENCY[p.country] || {sym:'S$',label:'/月'};
  const lo = p.min_rent ? Math.round(Number(p.min_rent)).toLocaleString() : '?';
  const hi = p.max_rent ? Math.round(Number(p.max_rent)).toLocaleString() : '?';
  return c.sym+lo+'–'+hi+c.label;
}

// ═══ 地图 ═══
function initMap() {
  map = L.map('map', { center: [20,0], zoom:2, zoomControl:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(map);
}

// ═══ 加载 ═══
async function loadProperties() {
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const loader = document.getElementById('loader');
  const btn = document.getElementById('btnLoad');
  btn.disabled = true; loader.style.display = 'block';
  debug('━━━ 加载 ━━━', 'info');

  try {
    const url = baseUrl + '/buildings/public/search?limit=200';
    debug('GET ' + url, 'info');
    const start = performance.now();
    const resp = await fetch(url);
    debug('HTTP ' + resp.status + ' (' + Math.round(performance.now()-start) + 'ms)', resp.ok?'ok':'warn');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    let data = await resp.json();
    if (Array.isArray(data)) allProperties = data;
    else if (data && data.items) allProperties = data.items;
    else { debug('未知格式', 'warn'); allProperties = []; }

    const total = allProperties.length;
    allProperties = allProperties.filter(p => p.latitude && p.longitude);
    debug('收到 ' + total + ' 栋, 有坐标 ' + allProperties.length, 'ok');

    const cc = {}; allProperties.forEach(p => { const c = p.country==='GB'?'伦敦':p.country==='SG'?'新加坡':(p.country||'?'); cc[c] = (cc[c]||0)+1; });
    debug('分布: ' + JSON.stringify(cc), 'info');
    renderAll();
    debug('完成', 'ok');
  } catch (err) {
    debug('FAIL: ' + err.message, 'err');
  } finally {
    btn.disabled = false; loader.style.display = 'none';
  }
}

// ═══ 渲染 ═══
function renderAll() { renderStats(); renderFilters(); renderPropertyList(); renderMarkers(); }

function renderStats() {
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('statTotal').textContent = allProperties.length;
  const cities = new Set(allProperties.map(p => p.country==='GB'?'伦敦':'新加坡'));
  document.getElementById('statCities').textContent = cities.size;
  document.getElementById('statUT').textContent = allProperties.reduce((s,p)=>s+(p.unit_type_count||0), 0);
}

function renderFilters() {
  const row = document.getElementById('filterRow'); row.style.display = 'flex';
  const cc = {};
  allProperties.forEach(p => { const c = extractCity(p); cc[c] = (cc[c]||0)+1; });
  let h = '<div class="filter-chip' + (activeFilter==='all'?' active':'') + '" onclick="setFilter(\'all\')">全部 (' + allProperties.length + ')</div>';
  for (const [c,n] of Object.entries(cc).sort()) h += '<div class="filter-chip' + (activeFilter===c?' active':'') + '" onclick="setFilter(\''+c+'\')">'+c+' ('+n+')</div>';
  row.innerHTML = h;
}

function extractCity(p) { return p.country==='GB'?'伦敦':p.country==='SG'?'新加坡':(p.city||'其他'); }
function setFilter(c) { activeFilter=c; renderFilters(); renderPropertyList(); renderMarkers(); }
function getFiltered() { return activeFilter==='all'?allProperties:allProperties.filter(p=>extractCity(p)===activeFilter); }

function renderPropertyList() {
  const list = document.getElementById('propertyList');
  const f = getFiltered();
  if (!f.length) { list.innerHTML = '<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">📭</div><div>没有匹配</div></div>'; return; }
  const CITY_COLORS = {'新加坡':'#a6e3a1','伦敦':'#f9e2af'};
  list.innerHTML = f.map(p => {
    const city = extractCity(p), cc = CITY_COLORS[city]||'var(--muted)';
    return '<div class="property-item" data-id="'+p.id+'" onclick="focusProperty('+p.id+')">'
      + '<div class="p-row"><div class="p-title">'+escHtml(p.name_cn||p.name||'?')+'</div>'
      + '<span class="p-city" style="background:'+cc+'22;color:'+cc+'">'+city+'</span></div>'
      + '<div class="p-info">'+(p.unit_type_count||0)+'种户型 · '+(p.unit_type_tags||[]).join(' · ')+'</div>'
      + '<div class="p-row"><div class="p-price">'+fmtPrice(p)+'</div>'
      + '<div class="p-info">'+escHtml(p.district||p.city||'')+'</div></div>';
  }).join('');
}

function focusProperty(id) {
  document.querySelectorAll('.property-item').forEach(el=>el.classList.remove('active'));
  const item = document.querySelector('.property-item[data-id="'+id+'"]');
  if (item) { item.classList.add('active'); item.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  const m = markers.find(m=>m.propertyId===id);
  if (m) { m.openPopup(); map.flyTo(m.getLatLng(),14,{duration:.8}); }
}

// ═══ 地图标记 ═══
function renderMarkers() {
  markers.forEach(m=>m.remove()); markers = [];
  const f = getFiltered(); if (!f.length) return;
  const bounds = [];
  f.forEach(p => {
    const lat=Number(p.latitude), lng=Number(p.longitude);
    if (isNaN(lat)||isNaN(lng)) return;
    const city = extractCity(p), color = city==='伦敦'?'#f38ba8':'#a6e3a1';
    const m = L.circleMarker([lat,lng], {radius:8,fillColor:color,color:'#fff',weight:1.5,fillOpacity:.85}).addTo(map);
    m.propertyId = p.id;
    m.bindPopup('<div class="popup-title">'+escHtml(p.name_cn||p.name||'?')+'</div>'
      + '<div class="popup-price">'+fmtPrice(p)+'</div>'
      + '<div class="popup-row">📍 '+escHtml(p.address||p.district||'')+'</div>'
      + '<div class="popup-row">🏠 '+(p.unit_type_count||0)+'户型 · '+(p.unit_type_tags||[]).join(' · ')+'</div>'
      + '<div class="popup-badges"><span class="popup-badge">'+city+'</span>'
      + (p.unit_type_tags||[]).slice(0,3).map(t=>'<span class="popup-badge">'+t+'</span>').join('')
      + '<span class="popup-badge">#'+p.id+'</span></div>');
    markers.push(m); bounds.push([lat,lng]);
  });
  if (bounds.length) map.fitBounds(bounds, {padding:[40,40], maxZoom:13});
  renderUniversities();
}

// ═══ 大学标记 ═══
function renderUniversities() {
  uniMarkers.forEach(m=>m.remove()); uniMarkers = [];
  if (!showUniversities) return;
  let unis = UNIVERSITIES;
  if (activeFilter!=='all') unis = UNIVERSITIES.filter(u=>u.city===activeFilter);
  unis.forEach(u => {
    const color = UNI_COLORS[u.city]||'#fff';
    const icon = L.divIcon({className:'uni-marker', html:'<div style="width:14px;height:14px;transform:rotate(45deg);background:'+color+';border:2px solid #fff;border-radius:2px"></div>', iconSize:[14,14], iconAnchor:[7,7]});
    const m = L.marker([u.lat,u.lng],{icon}).addTo(map);
    m.bindPopup('<div class="popup-title">🎓 '+escHtml(u.name)+'</div><div class="popup-row">📍 '+u.city+'</div><div class="popup-badges"><span class="popup-badge" style="background:'+color+'22;color:'+color+'">'+u.city+'</span><span class="popup-badge">'+u.abbr+'</span></div>');
    uniMarkers.push(m);
  });
}

function toggleUniversities() { showUniversities = document.getElementById('chkUni').checked; renderUniversities(); }
function escHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ═══ 启动 ═══
initMap();
renderUniversities();
if (location.protocol === 'file:') {
  debug('file:// 协议不支持跨域 - 请用 http://localhost:8080/PROPERTY_MAP.html', 'err');
} else {
  debug('页面就绪: ' + location.protocol + '//' + location.host, 'ok');
  setTimeout(loadProperties, 500);
}
</script>
</body>
</html>
