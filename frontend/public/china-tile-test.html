<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSM 瓦片源测试 — 新加坡 / 英国</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Microsoft YaHei", system-ui, sans-serif;
    background: #0f0f1a; color: #e0e0e0;
    min-height: 100vh;
  }

  /* ── 顶栏 ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px;
    background: #1a1a2e; border-bottom: 2px solid #e94560;
  }
  .topbar h1 { font-size: 17px; white-space: nowrap; }
  .topbar .sep { flex: 1; }
  .topbar button {
    padding: 6px 16px; border: 1px solid #333; border-radius: 6px;
    background: #252540; color: #e0e0e0; cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  .topbar button:hover { background: #333360; }
  .topbar button.active { background: #e94560; border-color: #e94560; color: #fff; font-weight: 600; }
  .topbar button.primary { background: #00b894; border-color: #00b894; color: #fff; font-weight: 600; }
  .topbar button.primary:hover { background: #00a381; }
  .topbar .hint { font-size: 11px; color: #666; }
  #summary { font-size: 12px; color: #888; min-width: 200px; text-align: right; }

  /* ── 分类区块 ── */
  .section { margin: 16px 20px; }
  .section-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; margin-bottom: 8px;
    background: #1a1a2e; border-radius: 8px;
    cursor: pointer; user-select: none;
  }
  .section-header h2 { font-size: 14px; font-weight: 600; }
  .section-header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #252540; color: #888;
  }
  .section-header .arrow { transition: transform .2s; font-size: 12px; color: #888; }
  .section.collapsed .section-grid { display: none; }
  .section.collapsed .arrow { transform: rotate(-90deg); }

  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 8px;
  }

  /* ── 单个瓦片面板（内部分左右两栏：SG + UK）── */
  .tile-panel {
    display: flex; flex-direction: column;
    background: #1a1a2e; border-radius: 8px;
    border: 1px solid #252540; overflow: hidden;
    min-height: 260px;
  }
  .tile-panel.fail { border-color: #e9456033; }
  .tile-panel.ok   { border-color: #00b89433; }
  .tile-panel.partial { border-color: #e9a23b33; }

  .tp-label {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; font-size: 12px;
    background: #252540; gap: 8px;
  }
  .tp-label .name { font-weight: 600; white-space: nowrap; }
  .tp-label .status { font-size: 11px; font-weight: 600; min-width: 120px; text-align: right; }
  .status.waiting { color: #888; }
  .status.ok      { color: #00b894; }
  .status.partial { color: #e9a23b; }
  .status.fail    { color: #e94560; }

  .tp-maps {
    display: flex; flex: 1; min-height: 0; gap: 2px;
  }
  .tp-map-half {
    flex: 1; display: flex; flex-direction: column;
    min-height: 220px; position: relative;
  }
  .tp-map-half .loc-tag {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    z-index: 900; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 10px; pointer-events: none;
    background: rgba(0,0,0,.7); color: #fff;
  }
  .map-inst { flex: 1; background: #0a0a1a; }

  .leaflet-container { background: #0a0a1a !important; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🗺️ OSM 瓦片源测试</h1>
  <button id="btnSG" class="active" onclick="setLocation('sg')">🇸🇬 新加坡</button>
  <button id="btnUK" onclick="setLocation('uk')">🇬🇧 英国</button>
  <button id="btnBoth" onclick="setLocation('both')">🇸🇬+🇬🇧 并列</button>
  <span class="hint">当前模式点击面板可切换</span>
  <span class="sep"></span>
  <button onclick="collapseAll()">全部折叠</button>
  <button onclick="expandAll()">全部展开</button>
  <button class="primary" onclick="reloadAll()">🔄 全部重测</button>
  <span id="summary"></span>
</div>

<div id="sections"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══════════════════════════════════════════════
// 坐标
// ═══════════════════════════════════════════════
const LOCS = {
  sg: { center: [1.3521, 103.8198], zoom: 15, label: '🇸🇬 新加坡' },
  uk: { center: [51.5074, -0.1278], zoom: 15, label: '🇬🇧 伦敦' },
}

let viewMode = 'both'  // 'sg' | 'uk' | 'both'

// ═══════════════════════════════════════════════
// 瓦片源定义 — 纯 OSM / 国际源
// ═══════════════════════════════════════════════
const TILE_GROUPS = [
  {
    title: '🌍 OSM 官方 (tile.openstreetmap.org)',
    open: true,
    tiles: [
      { name: 'OSM 主站',      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
      { name: 'OSM (a)',        url: 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
      { name: 'OSM (b)',        url: 'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
      { name: 'OSM (c)',        url: 'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
      { name: 'OSM HTTP',       url: 'http://tile.openstreetmap.org/{z}/{x}/{y}.png',  opts: { maxZoom: 19 }, note: '无 TLS' },
    ],
  },
  {
    title: '🇪🇺 OSM 欧洲社区镜像',
    open: false,
    tiles: [
      { name: 'OSM 德国 (de)',   url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
      { name: 'OSM 法国 (fr)',   url: 'https://tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', opts: { maxZoom: 20 } },
      { name: 'OSM 法国 HOT',    url: 'https://tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', opts: { maxZoom: 20 }, note: 'Humanitarian，高对比' },
    ],
  },
  {
    title: '🗺️ Esri / ArcGIS',
    open: false,
    tiles: [
      { name: 'Esri 街道',       url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 19 } },
      { name: 'Esri 地形',       url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 19 } },
      { name: 'Esri 影像',       url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 19 } },
      { name: 'Esri 浅灰画布',   url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 19 } },
      { name: 'Esri NatGeo',     url: 'https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 16 } },
      { name: 'Esri 海图',       url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', opts: { maxZoom: 19 } },
    ],
  },
  {
    title: '🎨 CartoDB (Fastly CDN)',
    open: false,
    tiles: [
      { name: 'CartoDB 亮色',    url: 'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png', opts: { maxZoom: 19 }, note: 'Positron' },
      { name: 'CartoDB 暗色',    url: 'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',  opts: { maxZoom: 19 }, note: 'Dark Matter' },
      { name: 'CartoDB Voyager', url: 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png', opts: { maxZoom: 19 } },
      { name: 'CartoDB Voyager+标签', url: 'https://a.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}@2x.png', opts: { maxZoom: 19 } },
      { name: 'CartoDB 无标签',  url: 'https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}@2x.png', opts: { maxZoom: 19 } },
    ],
  },
  {
    title: '🌐 Stadia Maps / Stamen',
    open: false,
    tiles: [
      { name: 'Stadia Watercolor',     url: 'https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg', opts: { maxZoom: 18 } },
      { name: 'Stadia Toner',          url: 'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}.png',      opts: { maxZoom: 18 } },
      { name: 'Stadia Alidade Smooth', url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}.png',    opts: { maxZoom: 18 } },
      { name: 'Stadia Alidade Dark',   url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}.png', opts: { maxZoom: 18 } },
      { name: 'Stadia OSM Bright',     url: 'https://tiles.stadiamaps.com/tiles/osm_bright/{z}/{x}/{y}.png',        opts: { maxZoom: 18 } },
    ],
  },
  {
    title: '🚲 CyclOSM / OpenTopoMap / 其他',
    open: false,
    tiles: [
      { name: 'CyclOSM',            url: 'https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', opts: { maxZoom: 20 } },
      { name: 'OpenTopoMap',        url: 'https://a.tile.opentopomap.org/{z}/{x}/{y}.png',                  opts: { maxZoom: 17 } },
      { name: 'OpenRailwayMap',     url: 'https://a.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',     opts: { maxZoom: 19 } },
      { name: 'WaymarkedTrails 骑行', url: 'https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png',       opts: { maxZoom: 18 } },
      { name: 'WaymarkedTrails 徒步', url: 'https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png',        opts: { maxZoom: 18 } },
    ],
  },
  {
    title: '📚 Wikimedia / Bing / 其他',
    open: false,
    tiles: [
      { name: 'Wikimedia Maps', url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', opts: { maxZoom: 19 } },
    ],
  },
]

// ═══════════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════════
// allResults[panelIdx] = { name, results: { sg: {loaded,failed,ok}, uk: {loaded,failed,ok} } }
let allResults = []
let allMaps = []       // { map, layers: {sg, uk} }[]

// ═══════════════════════════════════════════════
// 构建 DOM
// ═══════════════════════════════════════════════
function buildUI() {
  const container = document.getElementById('sections')
  container.innerHTML = ''
  allResults = []

  let panelIdx = 0

  TILE_GROUPS.forEach((group, gi) => {
    const sec = document.createElement('div')
    sec.className = 'section' + (group.open ? '' : ' collapsed')
    sec.id = 'sec-' + gi

    sec.innerHTML = `
      <div class="section-header" onclick="toggleSection(${gi})">
        <span class="arrow">▼</span>
        <h2>${group.title}</h2>
        <span class="badge">${group.tiles.length} 个源</span>
      </div>
      <div class="section-grid" id="grid-${gi}"></div>
    `
    container.appendChild(sec)
    const grid = sec.querySelector('.section-grid')

    group.tiles.forEach((tileDef) => {
      const idx = panelIdx++
      const noteHtml = tileDef.note
        ? `<span style="color:#666;font-size:10px;margin-left:4px">${tileDef.note}</span>`
        : ''

      const panel = document.createElement('div')
      panel.className = 'tile-panel'
      panel.id = 'panel-' + idx

      panel.innerHTML = `
        <div class="tp-label">
          <span class="name">${tileDef.name}${noteHtml}</span>
          <span class="status waiting" id="status-${idx}">⏳ 等待</span>
        </div>
        <div class="tp-maps" id="maps-${idx}">
          <div class="tp-map-half" id="half-sg-${idx}">
            <div class="loc-tag">🇸🇬 SG</div>
            <div class="map-inst" id="map-sg-${idx}"></div>
          </div>
          <div class="tp-map-half" id="half-uk-${idx}">
            <div class="loc-tag">🇬🇧 UK</div>
            <div class="map-inst" id="map-uk-${idx}"></div>
          </div>
        </div>
      `

      grid.appendChild(panel)

      allResults.push({
        name: tileDef.name,
        sg: { loaded: 0, failed: 0, ok: false, done: false },
        uk: { loaded: 0, failed: 0, ok: false, done: false },
      })
    })
  })

  applyViewMode()
}

// ═══════════════════════════════════════════════
// 初始化地图
// ═══════════════════════════════════════════════
function initAllMaps() {
  // 清理
  allMaps.forEach(m => {
    try { m.map.remove() } catch(e){}
  })
  allMaps = []

  let panelIdx = 0

  TILE_GROUPS.forEach((group) => {
    group.tiles.forEach((tileDef) => {
      const idx = panelIdx++

      // 重置
      allResults[idx].sg = { loaded: 0, failed: 0, ok: false, done: false }
      allResults[idx].uk = { loaded: 0, failed: 0, ok: false, done: false }

      // 重置状态显示
      const statusEl = document.getElementById('status-' + idx)
      if (statusEl) { statusEl.textContent = '⏳ 等待'; statusEl.className = 'status waiting' }
      const panel = document.getElementById('panel-' + idx)
      if (panel) panel.className = 'tile-panel'

      // 创建 SG 地图
      const sgDiv = document.getElementById('map-sg-' + idx)
      const ukDiv = document.getElementById('map-uk-' + idx)

      if (!sgDiv || !ukDiv) return

      sgDiv.innerHTML = ''
      ukDiv.innerHTML = ''

      const sgMap = L.map('map-sg-' + idx, {
        zoomControl: false, attributionControl: false,
        center: LOCS.sg.center, zoom: LOCS.sg.zoom, fadeAnimation: false,
      })
      const ukMap = L.map('map-uk-' + idx, {
        zoomControl: false, attributionControl: false,
        center: LOCS.uk.center, zoom: LOCS.uk.zoom, fadeAnimation: false,
      })

      const sgLayer = L.tileLayer(tileDef.url, tileDef.opts)
      const ukLayer = L.tileLayer(tileDef.url, tileDef.opts)

      // SG 事件
      sgLayer.on('tileload',  () => { allResults[idx].sg.loaded++; updateStatus(idx) })
      sgLayer.on('tileerror', () => { allResults[idx].sg.failed++; updateStatus(idx) })

      // UK 事件
      ukLayer.on('tileload',  () => { allResults[idx].uk.loaded++; updateStatus(idx) })
      ukLayer.on('tileerror', () => { allResults[idx].uk.failed++; updateStatus(idx) })

      sgLayer.addTo(sgMap)
      ukLayer.addTo(ukMap)

      allMaps.push({ map: sgMap, layers: { sg: sgLayer, uk: ukLayer }, ukMap })
    })
  })

  setTimeout(checkDone, 2000)
}

// ═══════════════════════════════════════════════
// 状态更新
// ═══════════════════════════════════════════════
function updateStatus(idx) {
  const r = allResults[idx]
  const statusEl = document.getElementById('status-' + idx)
  const panel = document.getElementById('panel-' + idx)
  if (!statusEl) return

  // 判断 SG/UK 各自是否 OK
  const sgOk = r.sg.loaded > 0
  const ukOk = r.uk.loaded > 0

  if (sgOk && ukOk) {
    statusEl.textContent = `✅ SG ${r.sg.loaded} · UK ${r.uk.loaded}`
    statusEl.className = 'status ok'
    if (panel) panel.className = 'tile-panel ok'
  } else if (sgOk && !ukOk) {
    statusEl.textContent = `⚠️ SG ${r.sg.loaded} · UK ❌${r.uk.failed}`
    statusEl.className = 'status partial'
    if (panel) panel.className = 'tile-panel partial'
  } else if (!sgOk && ukOk) {
    statusEl.textContent = `⚠️ SG ❌${r.sg.failed} · UK ${r.uk.loaded}`
    statusEl.className = 'status partial'
    if (panel) panel.className = 'tile-panel partial'
  } else if (r.sg.failed > 3 || r.uk.failed > 3) {
    statusEl.textContent = `❌ SG ${r.sg.failed} · UK ${r.uk.failed} fail`
    statusEl.className = 'status fail'
    if (panel) panel.className = 'tile-panel fail'
  }
}

// ═══════════════════════════════════════════════
// 超时检测
// ═══════════════════════════════════════════════
function checkDone() {
  setTimeout(() => {
    let changed = false
    allResults.forEach((r, idx) => {
      if (r.sg.loaded === 0 && r.sg.failed === 0) {
        r.sg.failed = 999; changed = true
      }
      if (r.uk.loaded === 0 && r.uk.failed === 0) {
        r.uk.failed = 999; changed = true
      }
      if (changed) updateStatus(idx)
    })
    if (changed) printSummary()
  }, 10000)

  setTimeout(printSummary, 12000)
}

function printSummary() {
  const bothOk = allResults.filter(r => r.sg.loaded > 0 && r.uk.loaded > 0)
  const sgOnly = allResults.filter(r => r.sg.loaded > 0 && r.uk.loaded === 0)
  const ukOnly = allResults.filter(r => r.sg.loaded === 0 && r.uk.loaded > 0)
  const none   = allResults.filter(r => r.sg.loaded === 0 && r.uk.loaded === 0)

  let html = `✅ 双通 ${bothOk.length} · 🇸🇬仅 ${sgOnly.length} · 🇬🇧仅 ${ukOnly.length} · ❌ ${none.length}`

  document.getElementById('summary').textContent = html

  console.log('══════ 测试汇总 ══════')
  if (bothOk.length)  console.log('✅ 双通:',  bothOk.map(r => r.name).join(', '))
  if (sgOnly.length)  console.log('🇸🇬 仅SG通:', sgOnly.map(r => r.name).join(', '))
  if (ukOnly.length)  console.log('🇬🇧 仅UK通:', ukOnly.map(r => r.name).join(', '))
  if (none.length)    console.log('❌ 全不通:', none.map(r => r.name).join(', '))
  console.log('══════════════════════')
}

// ═══════════════════════════════════════════════
// 视图模式：sg / uk / both
// ═══════════════════════════════════════════════
function setLocation(mode) {
  viewMode = mode
  document.getElementById('btnSG').classList.toggle('active', mode === 'sg')
  document.getElementById('btnUK').classList.toggle('active', mode === 'uk')
  document.getElementById('btnBoth').classList.toggle('active', mode === 'both')
  applyViewMode()
}

function applyViewMode() {
  document.querySelectorAll('.tp-map-half').forEach(el => {
    if (viewMode === 'sg') {
      el.style.display = el.id.includes('-sg-') ? '' : 'none'
      // sg map 占满宽度
      if (el.id.includes('-sg-')) el.style.flex = '1'
    } else if (viewMode === 'uk') {
      el.style.display = el.id.includes('-uk-') ? '' : 'none'
      if (el.id.includes('-uk-')) el.style.flex = '1'
    } else {
      el.style.display = ''
      el.style.flex = '1'
    }
  })
  // 通知各 Leaflet 地图 invalidateSize
  setTimeout(() => {
    allMaps.forEach(m => {
      try { m.map.invalidateSize() } catch(e){}
      try { m.ukMap.invalidateSize() } catch(e){}
    })
  }, 100)
}

// ═══════════════════════════════════════════════
// UI 操作
// ═══════════════════════════════════════════════
function toggleSection(i) {
  document.getElementById('sec-' + i).classList.toggle('collapsed')
}

function collapseAll() {
  document.querySelectorAll('.section').forEach(s => s.classList.add('collapsed'))
}

function expandAll() {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('collapsed'))
}

function reloadAll() {
  initAllMaps()
}

// ═══════════════════════════════════════════════
// 启动
// ═══════════════════════════════════════════════
buildUI()

window.addEventListener('load', () => {
  setTimeout(initAllMaps, 300)
})
</script>

</body>
</html>
