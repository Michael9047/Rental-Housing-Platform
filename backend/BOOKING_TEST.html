<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预订 → 支付 → 签合同 全链路测试</title>
<style>
:root{--bg:#0f1117;--card:#161822;--border:#252836;--text:#cdd6f4;--muted:#6c7086;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af;--purple:#cba6f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:13px/1.6 system-ui;display:flex;height:100vh}
.left{width:320px;border-right:1px solid var(--border);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.right{flex:1;overflow-y:auto;padding:14px}
h2{font-size:15px;margin-bottom:4px;color:var(--accent)}
input,button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font:13px system-ui;outline:none;width:100%}
button{cursor:pointer;font-weight:600;border:none;margin-top:3px;transition:all .15s}
button:hover{opacity:.85}
.btn-login{background:#1a3824;color:var(--green)}
.btn-run{background:var(--green);color:var(--bg);padding:10px;font-size:14px}
.btn-run:disabled{opacity:.4}
.btn-step{background:var(--card);color:var(--text);border:1px solid var(--border);text-align:left;font-weight:400}
.btn-step:hover{border-color:var(--accent)}
.step{padding:6px 9px;border-radius:5px;margin-bottom:3px;font-size:12px;border:1px solid var(--border)}
.step.ok{border-color:#1a3824;background:#0a1a10}
.step.fail{border-color:#3a1a1a;background:#1a0a10}
.step.skip{border-color:#1a2a38;background:#0a101a}
.step .t{font-weight:600}
.step .d{color:var(--muted);font-size:11px;margin-top:1px;word-break:break-all}
.summary{font-size:13px;padding:10px;border-radius:6px;margin-top:6px}
.summary.ok{background:#1a3824;border:1px solid #2a5840;color:var(--green)}
.summary.err{background:#3a3a1a;border:1px solid #5a5a2a;color:var(--yellow)}
.section{color:var(--purple);font-weight:600;margin:8px 0 3px;font-size:12px}
</style></head><body>

<div class="left">
  <h2>🧪 预订·支付·合同</h2>
  <input id="baseUrl" value="http://localhost:8012/api/v1">

  <button class="btn-login" onclick="stepLogin()">🔑 1. 登录(租客)</button>
  <button class="btn-login" onclick="stepLandlordLogin()">🔑 1b. 登录(房东)</button>
  <div id="loginStatus" style="font-size:11px;color:var(--muted)"></div>

  <button class="btn-step" onclick="stepFetchRoom()">📋 2. 获取房源</button>
  <button class="btn-step" onclick="stepCreateBooking()">📝 3. 创建预订</button>
  <button class="btn-step" onclick="stepGenContract()">📄 4. 生成合同</button>
  <button class="btn-step" onclick="stepSignContract()">✍️ 5. 签署合同</button>
  <button class="btn-step" onclick="stepCreatePayment()">💳 6. 创建支付</button>
  <button class="btn-step" onclick="stepCheckPayment()">🔍 7. 查询支付</button>
  <button class="btn-step" onclick="stepListBookings()">📊 8. 预约列表</button>

  <button class="btn-run" onclick="runAll()" id="btnRun" disabled>▶ 运行全链路</button>
  <div id="summary"></div>
</div>

<div class="right" id="output">
  <div style="text-align:center;color:var(--muted);padding:60px 0">
    <div style="font-size:48px">🧪</div><div>预订 → 支付 → 签合同 全链路集成测试</div>
    <div style="font-size:11px;color:var(--yellow);margin-top:8px">从左侧逐步操作，或点「运行全链路」一键跑通</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let token='',landlordToken='',base='',roomId=null,bookingId=null,contractId=null,paymentId=null;
let pass=0,fail=0,skip=0;

function OUT(){return $('output')}
function log(title, ok, detail){
  const cls=ok===true?'ok':ok===false?'fail':'skip';
  const icon=ok===true?'✅':ok===false?'❌':'⏭️';
  const el=document.createElement('div');
  el.className='step '+cls;
  el.innerHTML=`<div class="t">${icon} ${title}</div>${detail?`<div class="d">${detail}</div>`:''}`;
  OUT().appendChild(el);el.scrollIntoView({behavior:'smooth'});
  if(ok===true)pass++;else if(ok===false)fail++;else skip++;
}
function sec(text){
  const el=document.createElement('div');
  el.className='section';el.textContent=text;
  OUT().appendChild(el);
}

base=$('baseUrl').value;
async function api(method, path, body, t){
  const tok=t||token;
  const h={'Content-Type':'application/json'};
  if(tok)h['Authorization']='Bearer '+tok;
  const opts={method,headers:h};
  if(body)opts.body=JSON.stringify(body);
  return fetch(base+path,opts);
}
function status(label,r){return `${label}: ${r.status}`}

// ═════ 1. 登录 ═════
async function doLogin(user,pass,label){
  let r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username_or_email:user,password:pass})});
  if(!r.ok){
    await fetch(base+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,email:user+'@t.com',password:pass})});
    r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username_or_email:user,password:pass})});
  }
  const d=await r.json();
  log(label,!!d.access_token,`uid=${d.user_id||d.id}`);
  return d.access_token;
}
async function stepLogin(){
  token=await doLogin('test_booking','test123456','租客登录');
  $('loginStatus').textContent=token?'✅ 租客已登录':'❌ 失败';
  if(token)$('btnRun').disabled=false;
}
async function stepLandlordLogin(){
  landlordToken=await doLogin('test_landlord','test123456','房东登录');
  $('loginStatus').textContent+=(landlordToken?' | ✅ 房东已登录':'');
}

// ═════ 2. 获取房源 ═════
async function stepFetchRoom(){
  if(!token){log('获取房源',null,'请先登录');return}
  const r=await fetch(base+'/properties/search?limit=3');
  if(r.ok){const items=await r.json();if(items.length){roomId=items[0].id;log('获取房源',true,`#${roomId} ${items[0].title?.slice(0,50)}`)}else log('获取房源',false,'无数据')}
  else log('获取房源',false,status('search',r));
}

// ═════ 3. 创建预订 ═════
async function stepCreateBooking(){
  if(!roomId){log('创建预订',null,'先获取房源');return}
  const r=await api('POST','/bookings',{property_id:roomId,scheduled_date:'2026-08-15',message:'集成测试'});
  if(r.ok){const d=await r.json();bookingId=d.id;log('创建预订',true,`booking #${bookingId}`)}
  else{const e=await r.text();log('创建预订',false,`${r.status} ${e.slice(0,150)}`)}
}

// ═════ 4. 生成合同 ═════
async function stepGenContract(){
  if(!bookingId){log('生成合同',null,'先创建预订');return}
  const r=await api('POST',`/contracts/${bookingId}/generate`);
  if(r.ok){const d=await r.json();contractId=d.id||d.agreement_id;log('生成合同',true,`contract #${contractId||'?'}`)}
  else{const e=await r.text();log('生成合同',false,`${r.status} ${e.slice(0,150)}`)}
}

// ═════ 5. 签署合同 ═════
async function stepSignContract(){
  if(!contractId){log('签署合同',null,'先生成合同');return}
  const r=await api('POST',`/contracts/${contractId}/sign`);
  if(r.ok)log('签署合同',true,`contract #${contractId} signed`)
  else if(r.status===404)log('签署合同',null,'合同不存在')
  else{const e=await r.text();log('签署合同',false,`${r.status} ${e.slice(0,150)}`)}
}

// ═════ 6. 创建支付 ═════
async function stepCreatePayment(){
  if(!bookingId){log('创建支付',null,'先创建预订');return}
  const r=await api('POST','/payments/create',{booking_id:bookingId,amount:3000});
  if(r.ok){const d=await r.json();paymentId=d.id;log('创建支付',true,`payment #${paymentId} ¥${d.amount||'?'}`)}
  else{const e=await r.text();log('创建支付',false,`${r.status} ${e.slice(0,150)}`)}
}

// ═════ 7. 查询支付 ═════
async function stepCheckPayment(){
  if(!bookingId){log('查询支付',null,'先创建预订');return}
  let r=await api('GET',`/payments/by-booking/${bookingId}`);
  if(r.ok){const d=await r.json();log('支付状态',true,`${d.status||d.payment_status||'?'} ¥${d.amount}`)}
  else if(r.status===404)log('支付状态',null,'未创建支付')
  else log('支付状态',false,status('query',r));
  r=await api('GET',`/payments/result/by-booking/${bookingId}`);
  if(r.ok)log('支付结果',true)
  else if(r.status===404)log('支付结果',null,'无结果')
  else log('支付结果',false,status('result',r));
}

// ═════ 8. 预约列表 ═════
async function stepListBookings(){
  if(!token){log('预约列表',null,'请先登录');return}
  const r=await api('GET','/bookings');
  if(r.ok){const d=await r.json();log('预约列表',true,`${d.length||d?.items?.length||0}条`)}
  else log('预约列表',false,status('list',r));
}

// ═════ 全链路 ═════
async function runAll(){
  OUT().innerHTML='';pass=fail=skip=0;
  sec('1. 登录');await stepLogin();
  sec('2. 获取房源');await stepFetchRoom();
  sec('3. 创建预订');await stepCreateBooking();
  sec('4. 生成合同');await stepGenContract();
  sec('5. 签署合同');await stepSignContract();
  sec('6. 创建支付');await stepCreatePayment();
  sec('7. 查询支付');await stepCheckPayment();
  const s=$('summary'),t=pass+fail+skip;
  s.innerHTML=fail===0
    ?`<div class="summary ok">✅ 全链路通过 (${pass}/${t})</div>`
    :`<div class="summary err">⚠️ ${fail}/${t} 失败, ${pass} 通过, ${skip} 跳过</div>`;
}
</script></body></html>
