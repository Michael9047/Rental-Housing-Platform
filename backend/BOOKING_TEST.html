<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预订流程全链路测试</title>
<style>
:root{--bg:#0f1117;--card:#161822;--border:#252836;--text:#cdd6f4;--muted:#6c7086;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--yellow:#f9e2af;--purple:#cba6f7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui;display:flex;height:100vh}
.left{width:340px;border-right:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.right{flex:1;overflow-y:auto;padding:16px}
h2{font-size:16px;margin-bottom:6px;color:var(--accent)}
input,button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font:13px system-ui;outline:none;width:100%}
input:focus{border-color:var(--accent)}
button{cursor:pointer;font-weight:600;border:none;margin-top:4px}
.btn-main{background:var(--green);color:var(--bg);padding:12px;font-size:14px;width:100%}
.btn-main:disabled{opacity:.4}
.step{padding:7px 10px;border-radius:6px;margin-bottom:4px;font-size:12px;border:1px solid var(--border)}
.step.ok{border-color:#1a3824;background:#0a1a10}
.step.fail{border-color:#3a1a1a;background:#1a0a10}
.step.skip{border-color:#1a2a38;background:#0a101a}
.step .t{font-weight:600}
.step .d{color:var(--muted);font-size:11px;margin-top:1px}
.summary{font-size:13px;padding:12px;border-radius:8px;margin-top:8px}
.summary.ok{background:#1a3824;border:1px solid #2a5840;color:var(--green)}
.summary.err{background:#3a3a1a;border:1px solid #5a5a2a;color:var(--yellow)}
.section{color:var(--purple);font-weight:600;margin:10px 0 4px;font-size:12px}
</style></head><body>

<div class="left">
  <h2>🧪 预订全链路测试</h2>
  <input id="baseUrl" value="http://localhost:8012/api/v1">
  <button onclick="autoLogin()">🔑 一键登录(租客)</button>
  <div id="loginStatus" style="font-size:11px;color:var(--muted)"></div>
  <button class="btn-main" onclick="runAll()" id="btnRun" disabled>▶ 运行全部测试</button>
  <div id="summary"></div>
</div>

<div class="right" id="output">
  <div style="text-align:center;color:var(--muted);padding:60px 0">
    <div style="font-size:48px">🧪</div>
    <div>预订+支付+合同+POI+安全 全链路集成测试</div>
    <div style="font-size:11px;color:var(--yellow);margin-top:12px">先点「一键登录」→ 自动获取房源 → 运行全部</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let token='', base='', roomId=null, unitTypeId=null, bookingId=null, orderId=null;
let pass=0, fail=0, skip=0;

function OUT(){return $('output')}
function log(title, ok, detail){
  const cls=ok===true?'ok':ok===false?'fail':'skip';
  const icon=ok===true?'✅':ok===false?'❌':'⏭️';
  const el=document.createElement('div');
  el.className='step '+cls;
  el.innerHTML=`<div class="t">${icon} ${title}</div>${detail?`<div class="d">${detail}</div>`:''}`;
  OUT().appendChild(el);el.scrollIntoView({behavior:'smooth'});
  if(ok===true)pass++;else if(ok===false)fail++;else skip++;
}
function sec(text){
  const el=document.createElement('div');
  el.className='section';el.textContent=text;
  OUT().appendChild(el);
}

async function api(method, path, body){
  const h={'Content-Type':'application/json'};
  if(token)h['Authorization']='Bearer '+token;
  const opts={method,headers:h};
  if(body)opts.body=JSON.stringify(body);
  return fetch(base+path,opts);
}

// ═══════════ 1. 登录 ═══════════
async function autoLogin(){
  OUT().innerHTML='';base=$('baseUrl').value;
  $('loginStatus').textContent='⏳ 登录中...';
  const u='test_booking',p='test123456';
  let r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username_or_email:u,password:p})});
  if(!r.ok){
    await fetch(base+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:u+'@t.com',password:p})});
    r=await fetch(base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username_or_email:u,password:p})});
  }
  const d=await r.json();token=d.access_token;
  log('租客登录',!!token,'uid='+(d.user_id||d.id||'?'));
  if(token){$('loginStatus').textContent='✅ 就绪 ('+u+')';$('btnRun').disabled=false}
  else $('loginStatus').textContent='❌ 登录失败';
}

// ═══════════ 2. 自动获取数据 ═══════════
async function fetchData(){
  // 公寓
  let r=await fetch(base+'/public/buildings?limit=1');
  if(r.ok){const items=await r.json();if(items.length)log('公寓数据',true,`#${items[0].id} ${items[0].name_cn||items[0].name}`)}
  else log('公寓数据',false,r.status);
  // 户型(公开)
  r=await fetch(base+'/unit-types?limit=1');
  if(r.ok){const d=await r.json();const items=d.items||[];if(items.length){unitTypeId=items[0].id;log('户型数据',true,`#${unitTypeId} ${items[0].name}`)}else log('户型数据',false,'无数据')}
  else log('户型数据',false,r.status);
  // 房源(用 search 端点)
  r=await fetch(base+'/properties/search?limit=3');
  if(r.ok){const items=await r.json();if(items.length){roomId=items[0].id;log('房源数据',true,`#${roomId} ${items[0].title?.slice(0,40)}`)}else log('房源数据',false,'无数据')}
  else log('房源数据',false,r.status);
}

// ═══════════ 3. 安全评分 ═══════════
async function testSafetyScore(){
  if(!roomId){log('安全评分',null,'无房源ID');return}
  // 查 property_pois
  const r=await api('GET',`/pois/${roomId}`);
  if(r.ok){const d=await r.json();const hasSafety=d?.safety_data?.safety_score>0;log('安全评分',hasSafety,hasSafety?`score=${d.safety_data.safety_score} om=${d.safety_data.om_score||'N/A'} npc=${d.safety_data.npc}`:'safety_data 为空')}
  else if(r.status===404)log('安全评分',null,'POI数据未生成(需跑Celery)')
  else log('安全评分',false,r.status);
}

// ═══════════ 4. POI 数据 ═══════════
async function testPOI(){
  if(!roomId){log('POI数据',null,'无房源ID');return}
  const r=await api('GET',`/pois/${roomId}/map`);
  if(r.ok){const d=await r.json();const cats=Object.keys(d?.categories||{});log('地图POI',cats.length>0,cats.length?`${cats.length}类: ${cats.join(',')}`:'无数据')}
  else if(r.status===404)log('地图POI',null,'未生成')
  else log('地图POI',false,r.status);
}

// ═══════════ 5. 购物车 ═══════════
async function testCart(){
  if(!roomId){log('购物车',null,'无房源ID');return}
  let r=await api('POST','/agent/cart/items',{property_id:roomId});
  const addOk=r.ok||r.status===409;
  log('加入候选',addOk,addOk?`room #${roomId}`:r.status);
  r=await api('GET','/agent/cart');
  if(r.ok){const d=await r.json();const n=d.items?.length||0;log('查看候选',n>0,`${n}套房源`)}
  else log('查看候选',false,r.status);
  r=await api('DELETE',`/agent/cart/items/${roomId}`);
  log('移除候选',r.ok||r.status===204,r.status.toString());
}

// ═══════════ 6. 预订流程 ═══════════
async function testBooking(){
  if(!roomId){log('预订',null,'无房源ID');return}
  // 确认预约
  const body={property_id:roomId,scheduled_date:'2026-08-15',message:'集成测试',full_name:'Test User',phone:'+65 9876 5432',contact_name:null,contact_phone:null};
  let r=await api('POST','/bookings',body);
  if(r.ok){
    const d=await r.json();bookingId=d.id;
    log('创建预订',true,`booking #${bookingId}`);
  }else{const e=await r.text();log('创建预订',false,`${r.status} ${e.slice(0,150)}`);return}

  // 查询
  r=await api('GET','/bookings');
  if(r.ok){const items=await r.json();log('查询预订',true,`${Array.isArray(items)?items.length:items?.items?.length||0}条`)}
  else log('查询预订',false,r.status);

  // 取消
  if(bookingId){
    r=await api('PATCH',`/bookings/${bookingId}/cancel`);
    log('取消预订',r.ok||r.status===200,r.status.toString());
    bookingId=null;
  }
}

// ═══════════ 7. 运行全部 ═══════════
async function runAll(){
  OUT().innerHTML='';pass=fail=skip=0;
  sec('── 数据准备 ──');
  await fetchData();
  sec('── 安全评分 ──');
  await testSafetyScore();
  sec('── POI 数据 ──');
  await testPOI();
  sec('── 购物车 ──');
  await testCart();
  sec('── 预订流程 ──');
  await testBooking();
  const s=$('summary');
  const t=pass+fail+skip;
  const html=fail===0
    ?`<div class="summary ok">✅ 全部通过 (${pass}/${t})</div>`
    :`<div class="summary err">⚠️ ${fail}/${t} 失败, ${pass} 通过</div>`;
  s.innerHTML=html;
}
</script></body></html>
